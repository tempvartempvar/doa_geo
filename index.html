<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title>TDOA / FDOA Geolocation</title>
  <meta name="description" content="Interactive lessons on passive radio geolocation with time and frequency difference of arrival.">

  <!-- Vendored library 1 of 2: KaTeX 0.16.9 (math), in vendor/katex. The app degrades to raw TeX if it fails to load. -->
  <link rel="stylesheet" href="vendor/katex/katex.min.css">
  <script defer src="vendor/katex/katex.min.js"></script>

  <!-- Vendored library 2 of 2: three.js 0.160.0 (3-D lessons), in vendor/three, resolved through this import map. -->
  <script type="importmap">
  {
    "imports": {
      "three": "./vendor/three/build/three.module.js",
      "three/addons/": "./vendor/three/examples/jsm/"
    }
  }
  </script>

  <link rel="stylesheet" href="css/app.css">
  <script type="module" src="js/main.js"></script>
</head>
<body>
  <a class="skip-link" href="#main">Skip to lesson</a>
  <div class="app" id="app">
    <aside class="sidebar" id="sidebar" aria-label="Lessons">
      <div class="sidebar-head">
        <a class="brand" href="#/welcome">
          <span class="brand-mark" aria-hidden="true">
            <svg viewBox="0 0 24 24" width="22" height="22"><circle cx="6" cy="17" r="2.4" fill="var(--collector-a)"/><circle cx="18" cy="17" r="2.4" fill="var(--collector-b)"/><path d="M4 5 Q12 13 20 5" fill="none" stroke="var(--tdoa)" stroke-width="1.8"/><path d="M11 9.6 l1 -1 l1 1 l-1 1z" fill="var(--emitter)" stroke="var(--emitter)" stroke-width="1.4"/></svg>
          </span>
          <span class="brand-text">TDOA&thinsp;/&thinsp;FDOA<small>Passive geolocation, interactively</small></span>
        </a>
        <button class="icon-btn drawer-close" id="drawer-close" type="button" aria-label="Close lesson list">
          <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
        </button>
      </div>
      <nav class="lesson-nav" id="lesson-nav"></nav>
      <div class="sidebar-foot">Use <kbd>&larr;</kbd> <kbd>&rarr;</kbd> to move between lessons.</div>
    </aside>
    <div class="scrim" id="scrim" hidden></div>

    <div class="main-col">
      <header class="topbar">
        <button class="icon-btn drawer-open" id="drawer-open" type="button" aria-label="Open lesson list" aria-controls="sidebar" aria-expanded="false">
          <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
        </button>
        <div class="topbar-title" id="topbar-title" aria-live="polite"></div>
        <div class="topbar-nav">
          <button class="btn btn-ghost" id="prev-btn" type="button" aria-label="Previous lesson">
            <svg viewBox="0 0 24 24" width="16" height="16" aria-hidden="true"><path d="M15 5l-7 7 7 7" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
            <span class="btn-text">Prev</span>
          </button>
          <span class="topbar-count" id="topbar-count"></span>
          <button class="btn btn-ghost" id="next-btn" type="button" aria-label="Next lesson">
            <span class="btn-text">Next</span>
            <svg viewBox="0 0 24 24" width="16" height="16" aria-hidden="true"><path d="M9 5l7 7-7 7" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
          </button>
        </div>
      </header>
      <main class="content" id="main" tabindex="-1">
        <noscript><div class="panel"><h2>JavaScript required</h2><p>This interactive course needs JavaScript and must be served over http (run <code>node serve.mjs</code>).</p></div></noscript>
      </main>
    </div>
  </div>
</body>
</html>
